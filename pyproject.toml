[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsard-vhp"
version = "1.0.0"
description = "Training-free score regularization over legislative structure for statutory article retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akram Benamar" },
    { name = "Mohamed Djallel Dilmi" },
    { name = "Faten Chaieb-Chakchouk" },
]
keywords = [
    "statutory article retrieval",
    "legal information retrieval",
    "score regularization",
    "BSARD",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dense = [
    "torch>=2.0",
    "sentence-transformers>=2.6",
]
lexical = ["nltk>=3.8"]
data = ["datasets>=2.18"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]
all = [
    "torch>=2.0",
    "sentence-transformers>=2.6",
    "nltk>=3.8",
    "datasets>=2.18",
    "matplotlib>=3.7",
    "pytest>=8.0",
]

[project.scripts]
bsard-vhp = "bsard_vhp.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
